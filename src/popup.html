<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>YouTube Wheel</title>
<style>
:root { color-scheme: dark; font-family: "IPA Pゴシック", "Hiragino Sans", sans-serif; }
body { margin: 0; width: 320px; background: #141311; color: #f3efe6; }
main { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 9px; }
h1 { margin: 0; font-size: 18px; font-weight: 700; }
label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
label.num { justify-content: space-between; padding-left: 24px; }
input[type=number], select { width: 72px; background: #24221f; color: #f3efe6; border: 1px solid #4a463f; border-radius: 4px; padding: 2px 4px; }
hr { border: 0; border-top: 1px solid #333; margin: 2px 0; width: 100%; }
h2 { margin: 0; font-size: 14px; }
button { background: #2d2a25; color: #f3efe6; border: 1px solid #4a463f; border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 6px; } .row input { flex: 1; background: #24221f; color: #f3efe6; border: 1px solid #4a463f; border-radius: 4px; padding: 3px 6px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
li { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #1e1c19; border-radius: 4px; padding: 4px 6px; }
li .d { flex: 1; overflow: hidden; text-overflow: ellipsis; } li label { font-size: 12px; }
.status { color: #ffb36b; min-height: 0; }
p { margin: 0; font-size: 11px; color: #b8b1a3; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="title"></h1>
  <label><input type="checkbox" id="enabled" /><span data-i18n="enabled"></span></label>
  <hr />
  <label><input type="checkbox" id="speedOn" /><span data-i18n="speedOn"></span></label>
  <label class="num"><span data-i18n="speedStep"></span>
    <select id="speedStep"><option>0.05</option><option>0.1</option><option>0.25</option><option>0.5</option></select></label>
  <label><input type="checkbox" id="invertSpeed" /><span data-i18n="invertSpeed"></span></label>
  <label><input type="checkbox" id="middleReset" /><span data-i18n="middleReset"></span></label>
  <hr />
  <label><input type="checkbox" id="seekOn" /><span data-i18n="seekOn"></span></label>
  <label class="num"><span data-i18n="seekSec"></span><input type="number" id="seekSec" min="1" max="600" step="1" /></label>
  <label><input type="checkbox" id="invertSeek" /><span data-i18n="invertSeek"></span></label>
  <hr />
  <label><input type="checkbox" id="blockHold" /><span data-i18n="blockHold"></span></label>
  <p data-i18n="note"></p>
  <hr />
  <h2 data-i18n="sites"></h2>
  <button id="addCurrent" type="button"><span data-i18n="addCurrent"></span> <span id="curDomain"></span></button>
  <div class="row"><input type="text" id="domainIn" /><button id="addBtn" type="button" data-i18n="add"></button></div>
  <ul id="siteList"></ul>
  <p id="status" class="status"></p>
  <p data-i18n="strongHelp"></p>
  <p data-i18n="reloadNote"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
